<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">DrugAI Lite architecture</title>
<desc id="desc">Architecture diagram showing molecule input flowing through RDKit, molecular representations, machine learning and rule based analysis into FastAPI and a browser interface.</desc>
<rect width="1400" height="820" fill="#f8fafc"/>
<text x="700" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">DrugAI Lite Architecture</text>
<text x="700" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Explainable computational drug-discovery workflow</text>

<g font-family="Arial, sans-serif">
  <rect x="55" y="150" width="190" height="90" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="150" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Molecule Input</text>
  <text x="150" y="216" text-anchor="middle" font-size="15" fill="#475569">SMILES / CSV / SMI</text>

  <rect x="300" y="130" width="210" height="130" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="405" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">RDKit</text>
  <text x="405" y="198" text-anchor="middle" font-size="15" fill="#475569">Parsing</text>
  <text x="405" y="222" text-anchor="middle" font-size="15" fill="#475569">Descriptors</text>
  <text x="405" y="246" text-anchor="middle" font-size="15" fill="#475569">Fingerprints / scaffolds</text>

  <rect x="570" y="105" width="235" height="180" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="687" y="143" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Analysis Layer</text>
  <text x="687" y="174" text-anchor="middle" font-size="15" fill="#475569">Solubility ensemble</text>
  <text x="687" y="199" text-anchor="middle" font-size="15" fill="#475569">Toxicity ensemble</text>
  <text x="687" y="224" text-anchor="middle" font-size="15" fill="#475569">Target activity</text>
  <text x="687" y="249" text-anchor="middle" font-size="15" fill="#475569">Analog search</text>
  <text x="687" y="274" text-anchor="middle" font-size="15" fill="#475569">Applicability signal</text>

  <rect x="865" y="105" width="235" height="180" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="982" y="143" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Scientific Filters</text>
  <text x="982" y="174" text-anchor="middle" font-size="15" fill="#475569">Lipinski</text>
  <text x="982" y="199" text-anchor="middle" font-size="15" fill="#475569">Veber</text>
  <text x="982" y="224" text-anchor="middle" font-size="15" fill="#475569">PAINS alerts</text>
  <text x="982" y="249" text-anchor="middle" font-size="15" fill="#475569">Murcko scaffold</text>
  <text x="982" y="274" text-anchor="middle" font-size="15" fill="#475569">Model agreement</text>

  <rect x="1160" y="145" width="185" height="100" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="1252" y="183" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Results</text>
  <text x="1252" y="211" text-anchor="middle" font-size="15" fill="#475569">Analysis / ranking</text>
  <text x="1252" y="233" text-anchor="middle" font-size="15" fill="#475569">Molecule rendering</text>

  <rect x="420" y="390" width="560" height="135" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="700" y="430" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">FastAPI Application</text>
  <text x="700" y="461" text-anchor="middle" font-size="15" fill="#475569">/api/analyze  •  /api/screen  •  /api/predict-activity</text>
  <text x="700" y="487" text-anchor="middle" font-size="15" fill="#475569">/api/health  •  /api/model-cards  •  /api/activity-targets</text>
  <text x="700" y="511" text-anchor="middle" font-size="15" fill="#475569">Pydantic validation • model loading • JSON responses</text>

  <rect x="150" y="640" width="300" height="105" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="300" y="680" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Browser Interface</text>
  <text x="300" y="709" text-anchor="middle" font-size="15" fill="#475569">Analyze • Screen • Activity • Model Cards</text>

  <rect x="550" y="640" width="300" height="105" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="700" y="680" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Model Artifacts</text>
  <text x="700" y="709" text-anchor="middle" font-size="15" fill="#475569">Random Forest • Gradient Boosting</text>

  <rect x="950" y="640" width="300" height="105" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="1100" y="680" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Data Sources</text>
  <text x="1100" y="709" text-anchor="middle" font-size="15" fill="#475569">ESOL • Tox21 • ChEMBL</text>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="245" y1="195" x2="300" y2="195"/>
    <line x1="510" y1="195" x2="570" y2="195"/>
    <line x1="805" y1="195" x2="865" y2="195"/>
    <line x1="1100" y1="195" x2="1160" y2="195"/>
    <line x1="1252" y1="245" x2="930" y2="390"/>
    <line x1="700" y1="525" x2="300" y2="640"/>
    <line x1="700" y1="525" x2="700" y2="640"/>
    <line x1="700" y1="525" x2="1100" y2="640"/>
  </g>
</g>

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
  </marker>
</defs>
</svg>
