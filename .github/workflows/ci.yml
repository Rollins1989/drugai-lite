name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Build Docker image
        working-directory: backend
        run: docker build --tag drugai-lite:ci .

      - name: Start Docker smoke test
        working-directory: backend
        run: |
          docker run --detach --rm --name drugai-lite-ci --publish 8000:8000 drugai-lite:ci
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs drugai-lite-ci
          exit 1

      - name: Stop Docker smoke test
        if: always()
        run: docker stop drugai-lite-ci || true
