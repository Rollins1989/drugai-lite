[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drugai-lite"
version = "4.0.0"
description = "Open-source computational drug-discovery workspace"
requires-python = ">=3.12,<3.14"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
